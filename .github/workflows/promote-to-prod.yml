name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The ECR image tag to deploy (e.g. the first 8 chars of a commit SHA)'
        required: true
        default: 'latest'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: board-buddy
  CFN_STACK_NAME: BoardBuddyStack-prod

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy CloudFormation stack
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.event.inputs.image_tag }}"
          
          aws cloudformation deploy \
            --stack-name "${CFN_STACK_NAME}" \
            --template-file template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment=prod \
              ContainerImage="${FULL_IMAGE}" \
              DomainName=${{ vars.DOMAIN_NAME }} \
            --no-fail-on-empty-changeset

      - name: Restart application on EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.event.inputs.image_tag }}"
          
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:cloudformation:stack-name,Values=${CFN_STACK_NAME}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
            
          if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[
                \"cd /opt/boardbuddy\",
                \"sed -i 's|image: .*amazonaws.com/board-buddy:.*|image: ${FULL_IMAGE}|g' docker-compose.yaml\",
                \"/usr/local/bin/docker-compose pull\",
                \"/usr/local/bin/docker-compose up -d\"
              ]"
          fi

  validate:
    name: Validate Production Deployment
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    environment: production

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get public IP from CloudFormation
        id: cfn
        run: |
          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --stack-name "${CFN_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" \
            --output text)
          echo "public_ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"

      - name: Wait for instance to pull new image and start
        run: |
          echo "Waiting 90s for EC2 user-data to pull and start the new image..."
          sleep 90

      - name: Validate health endpoint
        run: |
          HEALTH_URL="http://${{ steps.cfn.outputs.public_ip }}:8000/api/health"
          echo "Checking: ${HEALTH_URL}"

          for i in $(seq 1 20); do
            RESPONSE=$(curl -sf "${HEALTH_URL}" 2>/dev/null || true)
            if echo "${RESPONSE}" | jq -e '.status == "ok"' > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              echo "${RESPONSE}" | jq .
              exit 0
            fi
            echo "Attempt $i/20 — retrying in 15s..."
            sleep 15
          done

          echo "❌ Health check failed after all retries"
          exit 1
